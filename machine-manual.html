<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Manual</title><style>body{margin:0;font:14px Segoe UI,Arial;background:#f3f6f9;color:#102b49}header{padding:18px 5%;background:#071f3a;color:white;display:flex;justify-content:space-between}a{text-decoration:none;color:inherit}.wrap{width:92%;max-width:1100px;margin:28px auto}.search{padding:13px;width:100%;box-sizing:border-box;border:1px solid #dfe7ef;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.card{background:#fff;padding:20px;border:1px solid #dfe7ef;border-radius:14px}.tag{font-size:10px;color:#f47721;font-weight:800}.btn{display:inline-block;margin-top:15px;padding:9px 12px;background:#071f3a;color:white;border-radius:7px;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>PT. UNIVANCE INDONESIA • MACHINE MANUAL</b><a href="maintenance.html">← Menu Dojo</a></header><div class="wrap"><h1>Machine Manual</h1><p>Cari manual berdasarkan mesin, control, atau tipe dokumen.</p><input class="search" id="q" placeholder="Contoh: CNC, FANUC, Lathe, PLC"><div class="grid" id="grid"></div></div><script>const data=[['NC Lathe / CNC Lathe','Machine','Manual operasi, maintenance, alarm, parameter dan troubleshooting.'],['FANUC Control','Control','Manual control, parameter, servo dan alarm FANUC.'],['CNC Milling / Machining Center','Machine','Manual setting, maintenance dan troubleshooting.'],['PLC','Electrical','Referensi PLC, wiring, I/O dan troubleshooting.'],['Inverter & Servo','Electrical','Manual drive, parameter dan alarm.'],['Hydraulic & Pneumatic','Mechanical','Manual komponen, diagram dan maintenance.']];const g=document.getElementById('grid'),q=document.getElementById('q');function render(){let x=q.value.toLowerCase();g.innerHTML=data.filter(a=>a.join(' ').toLowerCase().includes(x)).map(a=>'<div class="card"><span class="tag">'+a[1]+'</span><h3>'+a[0]+'</h3><p>'+a[2]+'</p><a class="btn" href="#" onclick="return openDoc(this)">Buka Dokumen →</a></div>').join('')}q.oninput=render;render()function openDoc(el){let key=el.parentElement.querySelector("h3")?.textContent||el.closest(".item")?.querySelector("b")?.textContent||"Dokumen";let urls=JSON.parse(localStorage.getItem("dojoDocLinks")||"{}");if(urls[key]){window.open(urls[key],"_blank")}else{let u=prompt("Masukkan URL Google Drive/dokumen untuk: "+key);if(u){urls[key]=u;localStorage.setItem("dojoDocLinks",JSON.stringify(urls));alert("Link tersimpan. Klik tombol lagi untuk membuka dokumen.")}}return false}</script></body></html>
