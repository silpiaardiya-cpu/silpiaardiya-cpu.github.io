<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maintenance Report</title><style>body{margin:0;font:14px Segoe UI,Arial;background:#f3f6f9;color:#102b49}header{padding:18px 5%;background:#071f3a;color:white;display:flex;justify-content:space-between}a{color:inherit;text-decoration:none}.wrap{width:92%;max-width:1200px;margin:25px auto}.box{background:#fff;padding:20px;border-radius:14px;border:1px solid #dfe7ef;margin-bottom:18px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.form>*{padding:10px;border:1px solid #dfe7ef;border-radius:7px}.btn{background:#f47721;color:white;font-weight:700}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:11px}.scroll{overflow:auto}.stat{display:flex;gap:12px}.stat div{background:#f7fafc;padding:12px;border-radius:9px;flex:1}@media(max-width:750px){.form{grid-template-columns:1fr 1fr}.stat{flex-direction:column}}</style></head><body><header><b>PT. UNIVANCE INDONESIA • MAINTENANCE DOJO</b><a href="maintenance.html">← Menu Dojo</a></header><div class="wrap"><div class="box"><h2>Maintenance Report</h2><p>Catat breakdown, corrective, preventive maintenance, downtime, dan tindakan perbaikan.</p><form id="f" class="form"><input id="date" type="date" required><input id="machine" placeholder="Mesin" required><select id="type"><option>Breakdown</option><option>Corrective</option><option>Preventive</option><option>Inspection</option></select><input id="problem" placeholder="Problem / aktivitas" required><input id="action" placeholder="Action / perbaikan"><input id="down" type="number" min="0" placeholder="Downtime (menit)"><input id="pic" placeholder="PIC"><button class="btn">Simpan Report</button></form></div><div class="box stat"><div><b id="total">0</b><br>Total Report</div><div><b id="downTotal">0</b><br>Total Downtime (menit)</div><div><b id="break">0</b><br>Breakdown</div></div><div class="box"><input id="q" placeholder="Cari mesin / problem..." style="padding:10px;width:100%;box-sizing:border-box"><div class="scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Mesin</th><th>Type</th><th>Problem</th><th>Action</th><th>Downtime</th><th>PIC</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>let data=JSON.parse(localStorage.getItem('maintenanceReports')||'[]');const $=id=>document.getElementById(id);function render(){let q=$('q').value.toLowerCase(),a=data.filter(x=>(x.machine+' '+x.problem).toLowerCase().includes(q));$('rows').innerHTML=a.map(x=>'<tr><td>'+x.date+'</td><td>'+x.machine+'</td><td>'+x.type+'</td><td>'+x.problem+'</td><td>'+x.action+'</td><td>'+x.down+'</td><td>'+x.pic+'</td><td><button onclick="del('+data.indexOf(x)+')">Hapus</button></td></tr>').join('');$('total').textContent=data.length;$('downTotal').textContent=data.reduce((s,x)=>s+Number(x.down||0),0);$('break').textContent=data.filter(x=>x.type==='Breakdown').length}$('f').onsubmit=e=>{e.preventDefault();data.push({date:$('date').value,machine:$('machine').value,type:$('type').value,problem:$('problem').value,action:$('action').value,down:$('down').value,pic:$('pic').value});localStorage.setItem('maintenanceReports',JSON.stringify(data));e.target.reset();render()};function del(i){if(confirm('Hapus report?')){data.splice(i,1);localStorage.setItem('maintenanceReports',JSON.stringify(data));render()}}$('q').oninput=render;render()</script></body></html>
