<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOP & Work Instruction</title><style>body{margin:0;font:14px Segoe UI,Arial;background:#f3f6f9;color:#102b49}header{padding:18px 5%;background:#071f3a;color:white;display:flex;justify-content:space-between}a{text-decoration:none;color:inherit}.wrap{width:92%;max-width:1100px;margin:28px auto}.bar{display:flex;gap:10px}.bar>*{padding:11px;border:1px solid #dfe7ef;border-radius:8px}.bar input{flex:1}.list{margin-top:18px}.item{background:#fff;border:1px solid #dfe7ef;border-radius:12px;padding:17px;margin-bottom:10px;display:flex;justify-content:space-between;gap:15px}.btn{background:#071f3a;color:#fff;padding:8px 12px;border-radius:7px;white-space:nowrap;font-size:11px}@media(max-width:600px){.item{flex-direction:column}}</style></head><body><header><b>PT. UNIVANCE INDONESIA • SOP & WI</b><a href="maintenance.html">← Menu Dojo</a></header><div class="wrap"><h1>SOP & Work Instruction</h1><p>Filter dokumen berdasarkan kategori dan cari berdasarkan judul.</p><div class="bar"><input id="q" placeholder="Cari SOP / Work Instruction..."><select id="cat"><option>Semua</option><option>Preventive</option><option>Electrical</option><option>Mechanical</option><option>Safety</option></select></div><div class="list" id="list"></div></div><script>const data=[['SOP Preventive Maintenance','Preventive','Standar pelaksanaan preventive maintenance mesin.'],['WI Lubrication Machine','Mechanical','Langkah kerja lubrication dan pemeriksaan.'],['WI Electrical Panel Inspection','Electrical','Instruksi inspeksi panel electrical.'],['SOP Breakdown Handling','Safety','Alur penanganan breakdown dan pengamanan mesin.'],['WI Sensor Replacement','Electrical','Langkah penggantian dan pengecekan sensor.'],['SOP Machine Cleaning','Safety','Standar cleaning area dan mesin.']];function render(){let q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('cat').value;document.getElementById('list').innerHTML=data.filter(x=>(c==='Semua'||x[1]===c)&&x.join(' ').toLowerCase().includes(q)).map(x=>'<div class="item"><div><b>'+x[0]+'</b><small style="display:block;color:#667b91;margin-top:6px">'+x[2]+'</small></div><a class="btn" href="https://drive.google.com/" target="_blank">Buka Dokumen</a></div>').join('')}q.oninput=render;cat.onchange=render;render()function openDoc(el){let key=el.parentElement.querySelector("h3")?.textContent||el.closest(".item")?.querySelector("b")?.textContent||"Dokumen";let urls=JSON.parse(localStorage.getItem("dojoDocLinks")||"{}");if(urls[key]){window.open(urls[key],"_blank")}else{let u=prompt("Masukkan URL Google Drive/dokumen untuk: "+key);if(u){urls[key]=u;localStorage.setItem("dojoDocLinks",JSON.stringify(urls));alert("Link tersimpan. Klik tombol lagi untuk membuka dokumen.")}}return false}</script></body></html>
