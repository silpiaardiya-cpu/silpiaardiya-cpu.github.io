<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Pendidikan | Maintenance Dojo</title><style>body{margin:0;font:14px Segoe UI,Arial;background:#f3f6f9;color:#102b49}header{padding:18px 5%;background:#071f3a;color:white;display:flex;justify-content:space-between}a{color:inherit;text-decoration:none}.wrap{width:92%;max-width:1200px;margin:25px auto}.box{background:white;padding:20px;border-radius:14px;margin-bottom:18px;border:1px solid #dfe7ef}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form>*{padding:11px;border:1px solid #dfe7ef;border-radius:8px}.btn{background:#f47721;color:white;border:0;cursor:pointer;font-weight:700}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.actions button{margin-right:4px;padding:5px;border:0;border-radius:5px;cursor:pointer}.del{background:#fee}.edit{background:#eef5ff}@media(max-width:700px){.form{grid-template-columns:1fr}.table{min-width:750px}.scroll{overflow:auto}}</style></head><body><header><b>PT. UNIVANCE INDONESIA • MAINTENANCE DOJO</b><a href="maintenance.html">← Menu Dojo</a></header><div class="wrap"><div class="box"><h2>Schedule Pendidikan</h2><p>Tambah, ubah, hapus, dan cari jadwal. Data tersimpan di browser ini.</p><form id="f" class="form"><input id="date" type="date" required><input id="name" placeholder="Nama training" required><input id="dept" placeholder="Departemen" required><input id="trainer" placeholder="Trainer"><input id="loc" placeholder="Lokasi"><select id="status"><option>Planned</option><option>On Going</option><option>Completed</option><option>Cancelled</option></select><button class="btn">Simpan Jadwal</button></form></div><div class="box"><input id="q" placeholder="Cari training / departemen..." style="padding:11px;width:100%;box-sizing:border-box"><p id="count"></p><div class="scroll"><table class="table"><thead><tr><th>Tanggal</th><th>Training</th><th>Dept</th><th>Trainer</th><th>Lokasi</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>let data=JSON.parse(localStorage.getItem('dojoSchedule')||'[]'),edit=-1;const $=id=>document.getElementById(id);function save(){localStorage.setItem('dojoSchedule',JSON.stringify(data));render()}function render(){let q=$('q').value.toLowerCase();let a=data.filter(x=>(x.name+' '+x.dept).toLowerCase().includes(q)).sort((a,b)=>a.date.localeCompare(b.date));$('rows').innerHTML=a.map((x,i)=>'<tr><td>'+x.date+'</td><td>'+x.name+'</td><td>'+x.dept+'</td><td>'+x.trainer+'</td><td>'+x.loc+'</td><td>'+x.status+'</td><td class="actions"><button class="edit" onclick="editRow('+data.indexOf(x)+')">Edit</button><button class="del" onclick="delRow('+data.indexOf(x)+')">Hapus</button></td></tr>').join('');$('count').textContent=a.length+' jadwal'}$('f').onsubmit=e=>{e.preventDefault();let x={date:$('date').value,name:$('name').value,dept:$('dept').value,trainer:$('trainer').value,loc:$('loc').value,status:$('status').value};if(edit<0)data.push(x);else data[edit]=x;edit=-1;e.target.reset();save()};function editRow(i){let x=data[i];edit=i;['date','name','dept','trainer','loc','status'].forEach(k=>$(k).value=x[k])}function delRow(i){if(confirm('Hapus jadwal ini?')){data.splice(i,1);save()}}$('q').oninput=render;render()</script></body></html>
