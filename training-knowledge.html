<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training & Knowledge</title><style>body{margin:0;font:14px Segoe UI,Arial;background:#f3f6f9;color:#102b49}header{padding:18px 5%;background:#071f3a;color:white;display:flex;justify-content:space-between}a{text-decoration:none;color:inherit}.wrap{width:92%;max-width:1100px;margin:28px auto}.bar{display:flex;gap:10px}.bar>*{padding:11px;border:1px solid #dfe7ef;border-radius:8px}.bar input{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:#fff;padding:20px;border:1px solid #dfe7ef;border-radius:14px}.tag{font-size:10px;color:#f47721;font-weight:800}.btn{display:inline-block;margin-top:12px;padding:9px 12px;background:#071f3a;color:#fff;border-radius:7px;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>PT. UNIVANCE INDONESIA • TRAINING & KNOWLEDGE</b><a href="maintenance.html">← Menu Dojo</a></header><div class="wrap"><h1>Training & Knowledge</h1><p>Materi pembelajaran dan knowledge sharing untuk pengembangan kompetensi maintenance.</p><div class="bar"><input id="q" placeholder="Cari materi..."><select id="cat"><option>Semua</option><option>Electrical</option><option>Mechanical</option><option>PLC</option><option>Safety</option></select></div><div class="grid" id="grid"></div></div><script>const data=[['Basic PLC','PLC','Dasar input-output, ladder, troubleshooting dan latihan.'],['CNC Maintenance Basic','Mechanical','Dasar perawatan CNC, alarm dan preventive maintenance.'],['Electrical Safety','Safety','Keselamatan kerja electrical dan LOTO awareness.'],['Hydraulic Basic','Mechanical','Dasar hydraulic system dan troubleshooting.'],['FANUC Knowledge Sharing','Electrical','Parameter, alarm dan servo FANUC.'],['Preventive Maintenance Best Practice','Safety','Knowledge sharing metode preventive maintenance.']];function render(){let q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('cat').value;document.getElementById('grid').innerHTML=data.filter(x=>(c==='Semua'||x[1]===c)&&x.join(' ').toLowerCase().includes(q)).map(x=>'<div class="card"><span class="tag">'+x[1]+'</span><h3>'+x[0]+'</h3><p>'+x[2]+'</p><a class="btn" href="#" onclick="return openDoc(this)">Buka Materi →</a></div>').join('')}q.oninput=render;cat.onchange=render;render()function openDoc(el){let key=el.parentElement.querySelector("h3")?.textContent||el.closest(".item")?.querySelector("b")?.textContent||"Dokumen";let urls=JSON.parse(localStorage.getItem("dojoDocLinks")||"{}");if(urls[key]){window.open(urls[key],"_blank")}else{let u=prompt("Masukkan URL Google Drive/dokumen untuk: "+key);if(u){urls[key]=u;localStorage.setItem("dojoDocLinks",JSON.stringify(urls));alert("Link tersimpan. Klik tombol lagi untuk membuka dokumen.")}}return false}</script></body></html>
